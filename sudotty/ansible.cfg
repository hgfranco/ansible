# config file for ansible -- http://ansible.github.com

[defaults]
roles_path = ../roles
host_key_checking = False
forks=50

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=120m -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ForwardAgent=yes
scp_if_ssh = True
timeout = 600
