---
- name: Apply Kubernetes sysctls
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart containerd
  ansible.builtin.systemd_service:
    name: containerd
    state: restarted

- name: Restart kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    state: restarted
