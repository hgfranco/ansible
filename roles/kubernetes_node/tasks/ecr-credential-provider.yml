---
- name: Check the locally built ECR credential provider
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../.artifacts/ecr-credential-provider/{{ kubernetes_ecr_credential_provider_version }}/ecr-credential-provider"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: kubernetes_node_ecr_binary
  tags: [ecr_provider_preflight]

- name: Verify the ECR credential provider checksum
  ansible.builtin.assert:
    that:
      - kubernetes_node_ecr_binary.stat.exists
      - kubernetes_node_ecr_binary.stat.checksum | default('') == kubernetes_ecr_credential_provider_sha256
    fail_msg: Build the pinned ECR credential provider and verify its checksum before provisioning.
  tags: [ecr_provider_preflight]

- name: Create ECR credential provider directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /usr/local/libexec/kubelet-credential-providers
    - /etc/kubernetes/credential-providers

- name: Install the ECR credential provider
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../.artifacts/ecr-credential-provider/{{ kubernetes_ecr_credential_provider_version }}/ecr-credential-provider"
    dest: /usr/local/libexec/kubelet-credential-providers/ecr-credential-provider
    owner: root
    group: root
    mode: '0755'
  notify: Restart kubelet

- name: Configure the ECR credential provider
  ansible.builtin.template:
    src: ecr-credential-provider.yaml.j2
    dest: /etc/kubernetes/credential-providers/ecr.yaml
    owner: root
    group: root
    mode: '0644'
  notify: Restart kubelet
