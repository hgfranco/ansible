name: Kubernetes configuration checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned validation tools
        run: python -m pip install ansible-core==2.21.4 ansible-lint==26.9.0 -r requirements-controller.txt

      - name: Install pinned inventory collection
        run: ansible-galaxy collection install -r requirements.yml

      - name: Lint Kubernetes automation
        run: >-
          ansible-lint playbooks/prepare-kubernetes.yml
          playbooks/kubernetes.yml playbooks/fetch-kubeconfig.yml

      - name: Check syntax using offline inventory
        run: |
          ansible-playbook -i tests/inventory.yml -e @inventory/group_vars/kubernetes.yml playbooks/kubernetes.yml --syntax-check
          ansible-playbook -i tests/inventory.yml -e @inventory/group_vars/kubernetes.yml playbooks/fetch-kubeconfig.yml --syntax-check

      - name: Test network validation and rendered configuration
        run: python -m unittest discover -s tests -v
