name: Kubernetes configuration checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned validation tools
        run: python -m pip install ansible-core==2.21.4 ansible-lint==26.9.0 -r requirements-controller.txt

      - name: Install pinned inventory collection
        run: ansible-galaxy collection install -r requirements.yml

      - name: Lint Kubernetes automation
        run: >-
          ansible-lint playbooks/prepare-kubernetes.yml
          playbooks/kubernetes.yml playbooks/fetch-kubeconfig.yml
          playbooks/install-ebs-csi.yml

      - name: Check syntax using offline inventory
        run: |
          ansible-playbook -i tests/inventory.yml -e @inventory/group_vars/kubernetes.yml playbooks/kubernetes.yml --syntax-check
          ansible-playbook -i tests/inventory.yml -e @inventory/group_vars/kubernetes.yml playbooks/fetch-kubeconfig.yml --syntax-check

          ansible-playbook -i localhost, playbooks/install-ebs-csi.yml --syntax-check

      - name: Set up pinned Helm for chart validation
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Render and validate the pinned EBS chart
        run: |
          helm repo add aws-ebs-csi-driver https://kubernetes-sigs.github.io/aws-ebs-csi-driver
          helm plugin install ./helm/ebs-csi-driver
          helm template aws-ebs-csi-driver aws-ebs-csi-driver/aws-ebs-csi-driver --version 2.66.1 --namespace kube-system --kube-version 1.35.9 --values helm/ebs-csi-driver/values.yaml --post-renderer ebs-csi-host-network > "$RUNNER_TEMP/ebs-rendered.yaml"
          python tests/validate_ebs_chart.py "$RUNNER_TEMP/ebs-rendered.yaml"

      - name: Download verified containerd binary for configuration validation
        env:
          RUNTIME_DIRECTORY: ${{ runner.temp }}/containerd-validation
        run: |
          mkdir -p "$RUNTIME_DIRECTORY"
          curl --fail --location --retry 3 https://github.com/containerd/containerd/releases/download/v2.2.1/containerd-2.2.1-linux-amd64.tar.gz -o "$RUNTIME_DIRECTORY/containerd.tar.gz"
          echo "f5d8e90ecb6c1c7e33ecddf8cc268a93b9e5b54e0e850320d765511d76624f41  $RUNTIME_DIRECTORY/containerd.tar.gz" | sha256sum --check
          tar -xzf "$RUNTIME_DIRECTORY/containerd.tar.gz" -C "$RUNTIME_DIRECTORY" bin/containerd
          echo "CONTAINERD_TEST_BINARY=$RUNTIME_DIRECTORY/bin/containerd" >> "$GITHUB_ENV"

      - name: Test network validation and rendered configuration
        run: python -m unittest discover -s tests -v
