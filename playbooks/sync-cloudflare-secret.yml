---
- name: Sync the Cloudflare connector token from AWS Secrets Manager
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    cloudflare_secret_region: us-east-1
    cloudflare_secret_source: cloudflare/spotify-now-playing/kubernetes/tunnel
    cloudflare_secret_namespace: spotify-now-playing
    cloudflare_secret_name: cloudflare-tunnel
    cloudflare_secret_kubeconfig: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/kubernetes-admin.conf"

  tasks:
    - name: Check the selected cluster kubeconfig exists
      ansible.builtin.stat:
        path: "{{ cloudflare_secret_kubeconfig }}"
      register: cloudflare_secret_kubeconfig_stat

    - name: Require the selected cluster kubeconfig
      ansible.builtin.assert:
        that:
          - cloudflare_secret_kubeconfig_stat.stat.isreg | default(false)
        fail_msg: >-
          Fetch the cluster kubeconfig first and start the SSH tunnel before
          running this playbook.
        quiet: true

    - name: Read the connector token without displaying its value
      ansible.builtin.set_fact:
        cloudflare_secret_payload: >-
          {{ lookup('amazon.aws.secretsmanager_secret', cloudflare_secret_source,
                    region=cloudflare_secret_region) | from_json }}
        cacheable: false
      no_log: true

    - name: Validate the connector token payload
      ansible.builtin.assert:
        that:
          - cloudflare_secret_payload is mapping
          - cloudflare_secret_payload.TUNNEL_TOKEN is defined
          - cloudflare_secret_payload.TUNNEL_TOKEN is string
          - cloudflare_secret_payload.TUNNEL_TOKEN | length > 0
          - cloudflare_secret_payload.TUNNEL_TOKEN == cloudflare_secret_payload.TUNNEL_TOKEN | trim
        quiet: true
      no_log: true

    - name: Create or reconcile the Kubernetes connector Secret
      kubernetes.core.k8s:
        kubeconfig: "{{ cloudflare_secret_kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ cloudflare_secret_name }}"
            namespace: "{{ cloudflare_secret_namespace }}"
          type: Opaque
          data:
            TUNNEL_TOKEN: "{{ cloudflare_secret_payload.TUNNEL_TOKEN | b64encode }}"
      no_log: true
      diff: false
