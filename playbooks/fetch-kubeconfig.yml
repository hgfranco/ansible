---
- name: Fetch cluster admin credentials for use through an SSH tunnel
  hosts: control_plane
  become: true
  gather_facts: false
  vars:
    kubernetes_local_kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/kubernetes-admin.conf"
    kubernetes_local_api_port: 16443
  tasks:
    - name: Read the administrator kubeconfig into memory
      ansible.builtin.slurp:
        src: /etc/kubernetes/admin.conf
      register: kubernetes_admin_credentials
      no_log: true

    - name: Create the local kubeconfig directory
      ansible.builtin.file:
        path: "{{ kubernetes_local_kubeconfig | dirname }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Confirm the administrator kubeconfig contains one cluster
      ansible.builtin.assert:
        that:
          - (kubernetes_admin_credentials.content | b64decode | from_yaml).clusters | length == 1
        fail_msg: Expected a single-cluster kubeadm administrator kubeconfig.
      no_log: true

    - name: Write a private kubeconfig pointing at the loopback SSH tunnel
      ansible.builtin.copy:
        dest: "{{ kubernetes_local_kubeconfig }}"
        content: >-
          {{ kubernetes_local_config |
             combine({'clusters': [kubernetes_local_cluster |
               combine({'cluster': kubernetes_local_cluster.cluster |
                 combine({'server': 'https://127.0.0.1:' ~ kubernetes_local_api_port})})]}) |
             to_nice_yaml }}
        mode: '0600'
      delegate_to: localhost
      become: false
      vars:
        kubernetes_local_config: "{{ kubernetes_admin_credentials.content | b64decode | from_yaml }}"
        kubernetes_local_cluster: "{{ kubernetes_local_config.clusters[0] }}"
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      no_log: true
